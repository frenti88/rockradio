<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#0B1120"/>
  <g transform="translate(400, 365)" fill="none" stroke="#F8FAFC" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- Fading screen frame in background -->
    <rect x="-155" y="-110" width="190" height="140" rx="20" stroke="#64748B" opacity="0.65"/>
    <line x1="-155" y1="-65" x2="35" y2="-65" stroke="#64748B" opacity="0.65"/>
    <!-- Arrow / flow transforming screen into delivered outcome -->
    <path d="M -25 55 C 15 95, 70 95, 110 55" stroke="#8B5CF6" stroke-width="12" stroke-dasharray="10 12"/>
    <!-- Outcome / completed service badge -->
    <circle cx="85" cy="10" r="82" fill="#10B981" stroke="#F8FAFC" stroke-width="14"/>
    <polyline points="48,12 74,38 124,-16" stroke="#0B1120" stroke-width="18"/>
  </g>
  <text x="400" y="645" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="8" fill="#F8FAFC">SERVICE AS SOFTWARE</text>
  <text x="400" y="692" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#10B981">MÁS ALLÁ DE LAS PANTALLAS</text>
  <text x="400" y="730" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#94A3B8">APARTE • FRED</text>
