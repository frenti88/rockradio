  </g>
  <text x="400" y="645" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="8" fill="#FFF1F2">LA DELICIOSA DISTANCIA</text>
  <text x="400" y="692" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="5" fill="#FB7185">RELATO ÍNTIMO • FRED</text>
