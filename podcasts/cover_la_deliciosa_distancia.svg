<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#2A0A18"/>
  <g transform="translate(400, 365)" fill="none" stroke="#FFF1F2" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Two soft overlapping silhouettes / crescents separated by a delicate space -->
