<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg18" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="50%" stop-color="#141e38"/>
      <stop offset="100%" stop-color="#1e1330"/>
    </linearGradient>
    <radialGradient id="glow18" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring18" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg18)"/>
  <rect width="600" height="600" fill="url(#glow18)"/>

  <!-- 6 orbiting chapter nodes forming an infinity / complete system -->
  <g transform="translate(300 245)" fill="none" stroke="url(#ring18)" stroke-linecap="round">
    <circle r="118" stroke-width="2" stroke-opacity="0.28" stroke-dasharray="6 8"/>
    <circle r="84" stroke-width="2.5" stroke-opacity="0.55"/>
    <path d="M -78 0 C -78 -44, -22 -44, 0 0 C 22 44, 78 44, 78 0 C 78 -44, 22 -44, 0 0 C -22 44, -78 44, -78 0 Z"
          stroke-width="5.5" stroke-opacity="0.95"/>
    <!-- 6 chapter dots -->
    <circle cx="0" cy="-118" r="7" fill="#fbbf24" stroke="none"/>
    <circle cx="102" cy="-59" r="7" fill="#38bdf8" stroke="none"/>
    <circle cx="102" cy="59" r="7" fill="#818cf8" stroke="none"/>
    <circle cx="0" cy="118" r="7" fill="#a78bfa" stroke="none"/>
    <circle cx="-102" cy="59" r="7" fill="#34d399" stroke="none"/>
    <circle cx="-102" cy="-59" r="7" fill="#f472b6" stroke="none"/>
  </g>

  <!-- Top badge -->
  <rect x="44" y="42" width="168" height="32" rx="16" fill="#ffffff" fill-opacity="0.09" stroke="#fbbf24" stroke-opacity="0.45"/>
  <text x="128" y="63" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8" fill="#fde68a">APARTE • ESPECIAL</text>

  <rect x="410" y="42" width="146" height="32" rx="16" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-opacity="0.5"/>
  <text x="483" y="63" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#fef3c7">6 CAPÍTULOS</text>

  <!-- Title -->
  <text x="44" y="446" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#ffffff">Sistema infinito</text>
  <text x="44" y="488" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#fbbf24">de ideas (Completa)</text>

  <!-- Subtitle -->
  <text x="44" y="528" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1">Los 6 capítulos en un solo episodio • Narrado por Fred</text>
  <text x="44" y="556" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Inspirado en la guía de Álvaro García</text>
</svg>
