  <text x="400" y="642" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="6" fill="#FEFCE8">7 FORMAS DE POTENCIAR IDEAS</text>
  <text x="400" y="688" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#FACC15">SISTEMA INFINITO DE IDEAS • CAP. 6/6</text>
  <text x="400" y="726" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#9CA3AF">APARTE • FRED • FINAL DE SERIE</text>
