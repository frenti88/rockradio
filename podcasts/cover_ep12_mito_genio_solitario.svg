<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#1C1917"/>
  <g transform="translate(400, 365)" fill="none" stroke="#FAFAF9" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- Interconnected constellation of ideas (instead of a single isolated bulb) -->
    <line x1="-115" y1="-65" x2="0" y2="0" stroke="#F59E0B" stroke-width="10"/>
    <line x1="115" y1="-65" x2="0" y2="0" stroke="#F59E0B" stroke-width="10"/>
    <line x1="-95" y1="85" x2="0" y2="0" stroke="#38BDF8" stroke-width="10"/>
    <line x1="95" y1="85" x2="0" y2="0" stroke="#38BDF8" stroke-width="10"/>
    <line x1="-115" y1="-65" x2="115" y2="-65" stroke="#78716C" stroke-width="6" stroke-dasharray="10 12"/>
    <line x1="-95" y1="85" x2="95" y2="85" stroke="#78716C" stroke-width="6" stroke-dasharray="10 12"/>
    <!-- Central hub -->
    <circle cx="0" cy="0" r="46" fill="#F59E0B" stroke="#FAFAF9" stroke-width="14"/>
    <!-- Surrounding idea nodes -->
    <circle cx="-115" cy="-65" r="24" fill="#1C1917" stroke="#FAFAF9" stroke-width="12"/>
    <circle cx="115" cy="-65" r="24" fill="#1C1917" stroke="#FAFAF9" stroke-width="12"/>
    <circle cx="-95" cy="85" r="24" fill="#1C1917" stroke="#38BDF8" stroke-width="12"/>
    <circle cx="95" cy="85" r="24" fill="#1C1917" stroke="#38BDF8" stroke-width="12"/>
  </g>
  <text x="400" y="642" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" letter-spacing="7" fill="#FAFAF9">EL MITO DEL GENIO SOLITARIO</text>
  <text x="400" y="688" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#F59E0B">SISTEMA INFINITO DE IDEAS • CAP. 1/6</text>
  <text x="400" y="726" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#A8A29E">APARTE • FRED</text>
</svg>
